<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Senior Management Report</title>
<style>
  /* Self-contained -- rendered via Playwright's page.set_content() with
     no live server context, so this can't load the app's normal
     /static stylesheet (relative URLs wouldn't resolve). A deliberately
     small, print-oriented subset of the on-screen page's look, not a
     full copy of the app's theme. */
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: #1a1d23; margin: 0; padding: 0 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 4px; }
  table.kv td { padding: 3px 10px 3px 0; }
  table.equipment-table th, table.equipment-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e5e7eb; }
  table.equipment-table th { border-bottom: 2px solid #1a1d23; }
  .callout { background: #f3f4f6; border-left: 3px solid #9ca3af; padding: 8px 12px; margin: 8px 0; font-size: 0.9rem; }
  .counts { display: grid; gap: 12px; margin: 12px 0; }
  .count-tile { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; }
  .count-tile .n { font-size: 1.3rem; font-weight: 700; }
  .count-tile .label { font-size: 0.8rem; color: #6b7280; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .badge-healthy { background: #dcfce7; color: #15803d; }
  .badge-malfunction { background: #fee2e2; color: #b91c1c; }
  .badge-unknown { background: #f3f4f6; color: #4b5563; }
  section { page-break-inside: avoid; }
</style>
</head>
<body>
{% include "management_report_content.html" %}
</body>
</html>
