{% extends "base.html" %}
{% block title %}Edit Cost Entry — Equipment Monitor{% endblock %}
{% block content %}
<h1>Edit Cost Entry</h1>

<section class="status-panel">
  <form method="post" action="/costs/{{ entry.id }}/edit" class="stacked-form" id="edit-cost-form" style="margin: 0;">
    <label>Date<input type="date" name="date" value="{{ entry.date }}" required></label>
    <label>Category
      <select name="category" id="category-select">
        {% for c in standard_categories %}
        <option value="{{ c }}" {% if is_standard_category and c == entry.category %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
        <option value="Others" {% if not is_standard_category %}selected{% endif %}>Others (specify)</option>
      </select>
    </label>
    <label id="custom-category-field" style="{% if is_standard_category %}display:none;{% endif %}">Specify category
      <input type="text" name="custom_category" value="{{ entry.category if not is_standard_category else '' }}" placeholder="e.g. Software Subscription">
    </label>
    <label id="vendor-field" style="{% if entry.category == staff_salaries_category %}display:none;{% endif %}">Vendor name <span style="font-weight:400;color:var(--muted);">(optional — defaults to "UNSPECIFIED" if left blank)</span>
      <input type="text" name="vendor_name" value="{{ entry.vendor_name or '' }}" placeholder="e.g. Fresh Farms Co.">
    </label>
    <label>Item / description (optional)<input type="text" name="item_name" value="{{ entry.item_name }}"></label>
    <label>Amount (₹)<input type="number" step="0.01" min="0" name="amount" value="{{ entry.amount }}" required></label>
    <button type="submit">Save Changes</button>
  </form>
  <p style="margin-top:14px;"><a href="/costs">← Back to Cost Management</a></p>
</section>

<script>
  (function () {
    var categorySelect = document.getElementById("category-select");
    var customCategoryField = document.getElementById("custom-category-field");
    var vendorField = document.getElementById("vendor-field");
    var staffSalariesCategory = {{ staff_salaries_category | tojson }};
    function syncCategory() {
      customCategoryField.style.display = categorySelect.value === "Others" ? "flex" : "none";
      vendorField.style.display = categorySelect.value === staffSalariesCategory ? "none" : "flex";
    }
    categorySelect.addEventListener("change", syncCategory);
    syncCategory();
  })();
</script>
{% endblock %}
